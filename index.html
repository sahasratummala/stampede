
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }

        .font-bebas {
            font-family: 'Bebas Neue', cursive;
        }

        /* UT Austin Burnt Orange */
        .bg-burnt-orange { background-color: #BF5700; }
        .text-burnt-orange { color: #BF5700; }
        .border-burnt-orange { border-color: #BF5700; }
        
        /* Custom Animations */
        @keyframes swipe-left {
            0% { transform: translateX(0) rotate(0); opacity: 1; }
            100% { transform: translateX(-200px) rotate(-20deg); opacity: 0; }
        }
        @keyframes swipe-right {
            0% { transform: translateX(0) rotate(0); opacity: 1; }
            100% { transform: translateX(200px) rotate(20deg); opacity: 0; }
        }
        .animate-swipe-left { animation: swipe-left 0.5s forwards; }
        .animate-swipe-right { animation: swipe-right 0.5s forwards; }
    </style>
